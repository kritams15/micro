server:
  port: 8888

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        - id: hotel-service
          uri: lb://HOTEL
          predicates:
            - Path=/hotel/**


        - id: room-service
          uri: lb://ROOM
          predicates:
            - Path=/rooms/**

        - id: customer
          uri: lb://CUSTOMER
          predicates:
            - Path=/cus/**


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
